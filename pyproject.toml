[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riigikogu-stats"
version = "0.1.0"
description = "ETL pipeline for Riigikogu sessions and voting statistics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pyinstaller>=6.0",
]

[project.scripts]
riigikogu-etl = "riigikogu_stats.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riigikogu_stats = ["config/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
